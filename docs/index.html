"Pornește monitorul și memento-ul săptămânal."], "ios_note": "Fișierul pentru iPhone nu este semnat cu un certificat de dezvoltator Apple; uneltele de instalare îl semnează cu propriul tău Apple ID.", "priv_h": "Confidențialitate", "priv": "Fără analiză, fără servere, fără conturi și fără permisiunea INTERNET: aplicația nu poate trimite nimic în afară. Tot ce arată rămâne pe telefon, iar backup-ul Android este dezactivat.", "build": "Necesită Node 24 sau mai nou și JDK 21. Rulează npm install, npm test, apoi npx cap sync. Fluxul GitHub Actions construiește APK-ul semnat și IPA-ul nesemnat și le atașează la fiecare etichetă v*.", "docs_h": "Documentație", "doc_l": ["Jurnal de modificări", "Cod sursă", "Versiuni"], "sup_h": "Susține proiectul", "sup": "STRAJA este gratuită și trade-free. Dacă îți este de folos, îi poți oferi autorului o cafea:", "foot": "MIT © Alexandru-Ionuț Chiuță (Alexio)", "sec": {"feat": "Funcții", "routes": "Cele patru căi de acces", "start": "Pornire rapidă", "lim": "Limite oneste", "build": "Construire", "priv": "Confidențialitate", "sup": "Susține proiectul", "lic": "Licență", "docs": "Documentație"}, "ver": "Versiune: {v} · Ultima actualizare: {d}", "how": "Cum te ajută", "allrel": "Toate versiunile", "fsm": "Text mai mic", "fsp": "Text mai mare", "pp": "Android poate afișa un avertisment de aplicație necunoscută sau Play Protect pentru un APK instalat manual. E normal: aplicația este open source și nu are permisiune de internet.", "nav": ["Pentru cine", "Încearcă", "Ecrane", "Funcții", "Pornire", "Docs"], "audx": [["Află cine îți citește telefonul.", ["Analizează: vezi toate aplicațiile cu acces la notificări, ecran, poze și SMS.", "Retrage: atinge aplicația și ajungi direct la ecranul potrivit din setări.", "Supraveghează: monitorul te anunță când apare un acces nou."]], ["O schimbare discretă de permisiuni nu trebuie să treacă neobservată.", ["Setează monitorul la 15 minute și acceptă starea curentă ca referință.", "Primești notificare în clipa în care o aplicație capătă acces la notificări, accesibilitate sau media.", "Pornește protecția ecranului în Signal și ecranul protejat al aplicației."]], ["Protejează oamenii care nu au cerut niciun agent.", ["Verificați împreună telefonul unei rude, aplicație cu aplicație.", "Trimite mesajul gata făcut prin care rogi contactele să nu dea conversațiile unui agent.", "Setează memento-ul săptămânal ca verificarea să devină obicei."]]], "name": "Română"}, "fr": {"tag": "Un bouclier contre les agents IA qui lisent votre téléphone", "lede": "STRAJA montre quelles applications peuvent lire vos notifications, votre écran, vos photos et vos SMS, vous prévient quand une nouvelle obtient un accès et vous amène à l'écran exact des réglages pour le retirer. Hors ligne, sans compte, sans permission Internet.", "dl_a": "Télécharger l'APK (Android)", "dl_i": "Télécharger l'IPA (iPhone, non signé)", "dl_s": "Code source sur GitHub", "stats": [["0", "permission Internet"], ["4", "voies d'accès auditées"], ["8", "langues"], ["12", "points de contrôle"]], "why_h": "Pourquoi STRAJA existe", "why": "En novembre 2026, un article de presse alertait : des agents IA dotés des bonnes permissions peuvent lire ce qui s'affiche sur le téléphone, messages d'applications chiffrées, photos, notifications. Le chiffrement n'est pas cassé ; le contenu est lu au moment où il s'affiche. STRAJA transforme cette alerte en quelque chose que l'on peut vérifier et corriger.", "routes_h": "Les quatre voies par lesquelles un agent atteint vos messages", "routes": [["Notifications", "Un écouteur de notifications voit chaque message à l'instant où il s'affiche, quelle que soit l'application."], ["Accessibilité", "Un service d'accessibilité peut lire tout l'écran et toucher à votre place."], ["Assistant numérique", "L'assistant par défaut peut recevoir le texte de l'écran ou une capture."], ["Photos et SMS", "Les permissions médias, stockage et SMS exposent votre galerie et vos messages."]], "demo_h": "Essayez l'audit", "demo_intro": "Un téléphone d'exemple. Activez et désactivez les accès et observez le risque, avec le même calcul que dans l'application.", "d_ch": ["Notifications", "Accessibilité", "Photos/SMS"], "d_risk": "Risque du téléphone", "d_lv": ["Risque faible", "Risque moyen", "Risque élevé"], "aud_h": "À qui s'adresse-t-elle", "aud": [["Tout le monde", "Voyez sur un seul écran qui peut lire votre téléphone et corrigez les pires cas en quelques touches."], ["Journalistes et militants", "Soyez alerté dès qu'une application obtient un nouvel accès, pour qu'un changement discret de permission ne passe pas inaperçu."], ["Familles", "Vérifiez ensemble le téléphone d'un proche et envoyez un message tout prêt demandant à vos contacts de ne pas confier vos conversations à un agent."]], "shots_h": "Écrans", "feat_h": "Fonctions", "feats": [["Audit des accès (Android)", "Liste les applications ayant accès aux notifications, services d'accessibilité, rôle d'assistant et permissions médias/SMS, avec un score de risque par application et pour tout le téléphone."], ["Surveillance en arrière-plan", "Un contrôle périodique compare le téléphone à une référence et vous avertit de chaque nouvel accès. Rien ne quitte le téléphone."], ["Une touche jusqu'au bon écran", "Ouvre la page exacte des réglages système pour retirer un accès ; ne modifie jamais rien en silence."], ["Accès temporaire", "Accordez un accès pour une tâche et recevez un rappel pour le retirer après 15 minutes, 1 heure, 4 heures ou un jour."], ["Guide de protection", "Une liste de 12 points tirée de l'article, un rappel hebdomadaire, la sécurité d'écran de Signal et un message à envoyer à vos contacts."], ["Privée par conception", "Pas de permission INTERNET, pas de sauvegarde, captures d'écran de l'application bloquées, 8 langues, thèmes clair et sombre."]], "lim_h": "Limites honnêtes", "lims": ["STRAJA ne peut pas arrêter un agent. Android et iOS ne permettent pas à une application de retirer l'accès d'une autre ; elle montre, prévient et vous mène au bon écran.", "Elle ne peut pas bloquer les captures faites par d'autres applications. Seul son propre écran est protégé.", "iPhone : iOS cache les permissions des autres applications, donc pas d'audit, seulement le guide, un registre manuel et des rappels.", "La liste des agents IA connus est indicative. Marquez à la main ce qui manque."], "start_h": "Démarrage rapide", "steps": ["Téléchargez l'APK (Android) ou l'IPA non signé (iPhone, à installer avec AltStore ou Sideloadly) depuis la dernière version.", "Ouvrez STRAJA et touchez Analyser maintenant (Android) ou ouvrez le Guide (iPhone).", "Ouvrez la liste des applications, touchez-en une et suivez le bouton pour retirer ce dont elle n'a pas besoin.", "Activez la surveillance et le rappel hebdomadaire."], "ios_note": "Le fichier iPhone n'est pas signé avec un certificat développeur Apple ; les outils d'installation le signent avec votre propre identifiant Apple.", "priv_h": "Confidentialité", "priv": "Ni analytique, ni serveurs, ni comptes, ni permission INTERNET : l'application ne peut rien envoyer à l'extérieur. Tout ce qu'elle affiche reste sur le téléphone, et la sauvegarde Android est désactivée.", "build": "Nécessite Node 24 ou plus récent et JDK 21. Lancez npm install, npm test, puis npx cap sync. Le workflow GitHub Actions construit l'APK signé et l'IPA non signé et les joint à chaque étiquette v*.", "docs_h": "Documentation", "doc_l": ["Journal des modifications", "Code source", "Versions"], "sup_h": "Soutenir le projet", "sup": "STRAJA est gratuite et trade-free. Si elle vous aide, vous pouvez offrir un café à l'auteur :", "foot": "MIT © Alexandru-Ionuț Chiuță (Alexio)", "sec": {"feat": "Fonctions", "routes": "Les quatre voies d'accès", "start": "Démarrage rapide", "lim": "Limites honnêtes", "build": "Construction", "priv": "Confidentialité", "sup": "Soutenir le projet", "lic": "Licence", "docs": "Documentation"}, "ver": "Version : {v} · Dernière mise à jour : {d}", "how": "Comment ça aide", "allrel": "Toutes les versions", "fsm": "Texte plus petit", "fsp": "Texte plus grand", "pp": "Android peut afficher un avertissement d'application inconnue ou Play Protect pour un APK installé manuellement. C'est normal : l'application est open source et n'a pas de permission Internet.", "nav": ["Pour qui", "Essayer", "Écrans", "Fonctions", "Démarrer", "Docs"], "audx": [["Sachez qui lit votre téléphone.", ["Analysez : voyez toutes les applications ayant accès aux notifications, à l'écran, aux photos et aux SMS.", "Retirez : touchez l'application et allez droit au bon écran des réglages.", "Surveillez : le moniteur vous prévient quand un nouvel accès apparaît."]], ["Un changement discret de permission ne doit jamais passer inaperçu.", ["Réglez le moniteur sur 15 minutes et acceptez l'état actuel comme référence.", "Recevez une notification dès qu'une application obtient l'accès aux notifications, à l'accessibilité ou aux médias.", "Activez la sécurité d'écran de Signal et l'écran protégé de l'application."]], ["Protégez ceux qui n'ont jamais demandé d'agent.", ["Passez en revue le téléphone d'un proche ensemble, application par application.", "Envoyez le message tout prêt demandant à vos contacts de ne pas transmettre les conversations à un agent.", "Activez le rappel hebdomadaire pour que la revue devienne une habitude."]]], "name": "Français"}, "it": {"tag": "Uno scudo contro gli agenti IA che leggono il tuo telefono", "lede": "STRAJA mostra quali app possono leggere notifiche, schermo, foto e SMS, ti avvisa quando una nuova ottiene accesso e ti porta alla schermata esatta delle impostazioni per revocarlo. Offline, senza account, senza permesso Internet.", "dl_a": "Scarica l'APK (Android)", "dl_i": "Scarica l'IPA (iPhone, non firmato)", "dl_s": "Sorgente su GitHub", "stats": [["0", "permessi Internet"], ["4", "vie di accesso verificate"], ["8", "lingue"], ["12", "punti della lista"]], "why_h": "Perché esiste STRAJA", "why": "A novembre 2026 un articolo di stampa avvertiva che gli agenti IA con i permessi giusti possono leggere ciò che appare sul telefono: messaggi di app cifrate, foto, notifiche. La cifratura non è violata; il contenuto viene letto nel momento in cui è mostrato. STRAJA trasforma l'avvertimento in qualcosa che puoi verificare e correggere.", "routes_h": "Le quattro vie con cui un agente raggiunge i tuoi messaggi", "routes": [["Notifiche", "Un ascoltatore di notifiche vede ogni messaggio nell'istante in cui viene mostrato, qualunque sia l'app."], ["Accessibilità", "Un servizio di accessibilità può leggere tutto lo schermo e toccare al posto tuo."], ["Assistente digitale", "L'assistente predefinito può ricevere il testo dello schermo o uno screenshot."], ["Foto e SMS", "I permessi per media, archiviazione e SMS espongono la galleria e i messaggi."]], "demo_h": "Prova l'audit", "demo_intro": "Un telefono di esempio. Attiva e disattiva gli accessi e osserva il rischio, con lo stesso calcolo dell'app.", "d_ch": ["Notifiche", "Accessibilità", "Foto/SMS"], "d_risk": "Rischio del telefono", "d_lv": ["Rischio basso", "Rischio medio", "Rischio alto"], "aud_h": "A chi serve", "aud": [["Tutti", "Vedi in una sola schermata chi può leggere il telefono e correggi i casi peggiori in pochi tocchi."], ["Giornalisti e attivisti", "Ricevi un avviso appena un'app ottiene un nuovo accesso, così una modifica silenziosa dei permessi non passa inosservata."], ["Famiglie", "Controllate insieme il telefono di un familiare e inviate un messaggio già pronto per chiedere ai contatti di non dare le tue chat a un agente."]], "shots_h": "Schermate", "feat_h": "Funzioni", "feats": [["Audit degli accessi (Android)", "Elenca le app con accesso alle notifiche, servizi di accessibilità, ruolo di assistente e permessi media/SMS, con un punteggio di rischio per app e per l'intero telefono."], ["Monitor in background", "Un controllo periodico confronta il telefono con una base di riferimento e ti avvisa a ogni nuovo accesso. Nulla esce dal telefono."], ["Un tocco fino alla schermata giusta", "Apre la pagina esatta delle impostazioni di sistema per revocare un accesso; non cambia mai nulla di nascosto."], ["Accesso temporaneo", "Dai accesso per un compito e ricevi un promemoria per revocarlo dopo 15 minuti, 1 ora, 4 ore o un giorno."], ["Guida alla protezione", "Una lista di 12 punti tratta dall'articolo, promemoria settimanale, sicurezza dello schermo di Signal e un messaggio per i tuoi contatti."], ["Privata per progetto", "Nessun permesso INTERNET, nessun backup, screenshot dell'app bloccati, 8 lingue, temi chiaro e scuro."]], "lim_h": "Limiti onesti", "lims": ["STRAJA non può fermare un agente. Android e iOS non permettono a un'app di revocare l'accesso di un'altra; mostra, avvisa e ti porta alla schermata giusta.", "Non può bloccare gli screenshot fatti da altre app. Solo il suo schermo è protetto.", "iPhone: iOS nasconde i permessi delle altre app, quindi niente audit, solo la guida, un registro manuale e promemoria.", "L'elenco degli agenti IA noti è indicativo. Segna a mano ciò che manca."], "start_h": "Avvio rapido", "steps": ["Scarica l'APK (Android) o l'IPA non firmato (iPhone, da installare con AltStore o Sideloadly) dall'ultima versione.", "Apri STRAJA e tocca Analizza ora (Android) oppure apri la Guida (iPhone).", "Apri l'elenco delle app, tocca un'app e segui il pulsante per revocare ciò che non le serve.", "Attiva il monitor e il promemoria settimanale."], "ios_note": "Il file per iPhone non è firmato con un certificato sviluppatore Apple; gli strumenti di installazione lo firmano con il tuo Apple ID.", "priv_h": "Privacy", "priv": "Nessuna analisi, nessun server, nessun account e nessun permesso INTERNET: l'app non può inviare nulla all'esterno. Tutto ciò che mostra resta sul telefono e il backup Android è disattivato.", "build": "Richiede Node 24 o successivo e JDK 21. Esegui npm install, npm test e poi npx cap sync. Il workflow GitHub Actions costruisce l'APK firmato e l'IPA non firmato e li allega a ogni tag v*.", "docs_h": "Documentazione", "doc_l": ["Registro delle modifiche", "Codice sorgente", "Versioni"], "sup_h": "Sostieni il progetto", "sup": "STRAJA è gratuita e trade-free. Se ti è utile, puoi offrire un caffè all'autore:", "foot": "MIT © Alexandru-Ionuț Chiuță (Alexio)", "sec": {"feat": "Funzioni", "routes": "Le quattro vie di accesso", "start": "Avvio rapido", "lim": "Limiti onesti", "build": "Compilazione", "priv": "Privacy", "sup": "Sostieni il progetto", "lic": "Licenza", "docs": "Documentazione"}, "ver": "Versione: {v} · Ultimo aggiornamento: {d}", "how": "Come aiuta", "allrel": "Tutte le versioni", "fsm": "Testo più piccolo", "fsp": "Testo più grande", "pp": "Android può mostrare un avviso di app sconosciuta o di Play Protect per un APK installato manualmente. È normale: l'app è open source e non ha il permesso Internet.", "nav": ["Per chi", "Prova", "Schermate", "Funzioni", "Avvio", "Docs"], "audx": [["Scopri chi legge il tuo telefono.", ["Analizza: vedi tutte le app con accesso a notifiche, schermo, foto e SMS.", "Revoca: tocca l'app e vai dritto alla schermata giusta delle impostazioni.", "Sorveglia: il monitor ti avvisa quando compare un nuovo accesso."]], ["Una modifica silenziosa dei permessi non deve passare inosservata.", ["Imposta il monitor a 15 minuti e accetta lo stato attuale come riferimento.", "Ricevi una notifica appena un'app ottiene accesso a notifiche, accessibilità o media.", "Attiva la sicurezza dello schermo in Signal e lo schermo protetto dell'app."]], ["Proteggi chi non ha mai chiesto un agente.", ["Controllate insieme il telefono di un familiare, app per app.", "Invia il messaggio già pronto che chiede ai contatti di non inoltrare le chat a un agente.", "Imposta il promemoria settimanale perché il controllo diventi un'abitudine."]]], "name": "Italiano"}, "es": {"tag": "Un escudo contra los agentes de IA que leen tu teléfono", "lede": "STRAJA te muestra qué apps pueden leer tus notificaciones, tu pantalla, tus fotos y tus SMS, te avisa cuando una nueva obtiene acceso y te lleva a la pantalla exacta de ajustes para retirarlo. Sin conexión, sin cuentas, sin permiso de Internet.", "dl_a": "Descargar APK (Android)", "dl_i": "Descargar IPA (iPhone, sin firmar)", "dl_s": "Código en GitHub", "stats": [["0", "permisos de Internet"], ["4", "vías de acceso auditadas"], ["8", "idiomas"], ["12", "puntos de la lista"]], "why_h": "Por qué existe STRAJA", "why": "En noviembre de 2026 un artículo de prensa advertía de que los agentes de IA con los permisos adecuados pueden leer lo que aparece en el teléfono: mensajes de apps cifradas, fotos, notificaciones. El cifrado no está roto; el contenido se lee cuando se muestra. STRAJA convierte esa advertencia en algo que puedes comprobar y corregir.", "routes_h": "Las cuatro vías por las que un agente llega a tus mensajes", "routes": [["Notificaciones", "Un oyente de notificaciones ve cada mensaje en el instante en que se muestra, sea cual sea la app."], ["Accesibilidad", "Un servicio de accesibilidad puede leer toda la pantalla y tocar por ti."], ["Asistente digital", "El asistente predeterminado puede recibir el texto de la pantalla o una captura."], ["Fotos y SMS", "Los permisos de medios, almacenamiento y SMS exponen tu galería y tus mensajes."]], "demo_h": "Prueba la auditoría", "demo_intro": "Un teléfono de ejemplo. Activa y desactiva accesos y observa el riesgo, con el mismo cálculo que la app.", "d_ch": ["Notificaciones", "Accesibilidad", "Fotos/SMS"], "d_risk": "Riesgo del teléfono", "d_lv": ["Riesgo bajo", "Riesgo medio", "Riesgo alto"], "aud_h": "Para quién es", "aud": [["Todos", "Mira en una sola pantalla quién puede leer tu teléfono y corrige los peores casos en pocos toques."], ["Periodistas y activistas", "Recibe un aviso en cuanto una app obtiene un nuevo acceso, para que un cambio discreto de permisos no pase inadvertido."], ["Familias", "Revisad juntos el teléfono de un familiar y enviad un mensaje ya preparado pidiendo a los contactos que no entreguen tus chats a un agente."]], "shots_h": "Pantallas", "feat_h": "Funciones", "feats": [["Auditoría de accesos (Android)", "Lista las apps con acceso a notificaciones, servicios de accesibilidad, rol de asistente y permisos de medios/SMS, con una puntuación de riesgo por app y para todo el teléfono."], ["Monitor en segundo plano", "Una comprobación periódica compara el teléfono con una referencia y te avisa de cada acceso nuevo. Nada sale del teléfono."], ["Un toque hasta la pantalla correcta", "Abre la página exacta de ajustes del sistema para retirar un acceso; nunca cambia nada en silencio."], ["Acceso temporal", "Concede acceso para una tarea y recibe un recordatorio para retirarlo a los 15 minutos, 1 hora, 4 horas o un día."], ["Guía de protección", "Una lista de 12 puntos del artículo, recordatorio semanal, seguridad de pantalla de Signal y un mensaje para tus contactos."], ["Privada por diseño", "Sin permiso INTERNET, sin copia de seguridad, capturas de la propia app bloqueadas, 8 idiomas, temas claro y oscuro."]], "lim_h": "Límites honestos", "lims": ["STRAJA no puede detener a un agente. Android e iOS no permiten que una app retire el acceso de otra; muestra, avisa y te lleva a la pantalla correcta.", "No puede bloquear las capturas hechas por otras apps. Solo su propia pantalla está protegida.", "iPhone: iOS oculta los permisos de otras apps, así que no hay auditoría, solo la guía, un registro manual y recordatorios.", "La lista de agentes de IA conocidos es orientativa. Marca a mano lo que falte."], "start_h": "Inicio rápido", "steps": ["Descarga el APK (Android) o el IPA sin firmar (iPhone, para instalar con AltStore o Sideloadly) de la última versión.", "Abre STRAJA y toca Analizar ahora (Android) o abre la Guía (iPhone).", "Abre la lista de apps, toca una y sigue el botón para retirar lo que no necesita.", "Activa el monitor y el recordatorio semanal."], "ios_note": "El archivo para iPhone no está firmado con un certificado de desarrollador de Apple; las herramientas de instalación lo firman con tu propio Apple ID.", "priv_h": "Privacidad", "priv": "Sin analítica, sin servidores, sin cuentas y sin permiso INTERNET: la app no puede enviar nada al exterior. Todo lo que muestra se queda en el teléfono y la copia de seguridad de Android está desactivada.", "build": "Requiere Node 24 o posterior y JDK 21. Ejecuta npm install, npm test y luego npx cap sync. El flujo de GitHub Actions construye el APK firmado y el IPA sin firmar y los adjunta a cada etiqueta v*.", "docs_h": "Documentación", "doc_l": ["Registro de cambios", "Código fuente", "Versiones"], "sup_h": "Apoya el proyecto", "sup": "STRAJA es gratuita y trade-free. Si te sirve, puedes invitar un café al autor:", "foot": "MIT © Alexandru-Ionuț Chiuță (Alexio)", "sec": {"feat": "Funciones", "routes": "Las cuatro vías de acceso", "start": "Inicio rápido", "lim": "Límites honestos", "build": "Compilación", "priv": "Privacidad", "sup": "Apoya el proyecto", "lic": "Licencia", "docs": "Documentación"}, "ver": "Versión: {v} · Última actualización: {d}", "how": "Cómo ayuda", "allrel": "Todas las versiones", "fsm": "Texto más pequeño", "fsp": "Texto más grande", "pp": "Android puede mostrar un aviso de app desconocida o de Play Protect para un APK instalado a mano. Es normal: la app es de código abierto y no tiene permiso de Internet.", "nav": ["Para quién", "Pruébalo", "Pantallas", "Funciones", "Inicio", "Docs"], "audx": [["Descubre quién lee tu teléfono.", ["Analiza: mira todas las apps con acceso a notificaciones, pantalla, fotos y SMS.", "Retira: toca la app y ve directo a la pantalla de ajustes correcta.", "Vigila: el monitor te avisa cuando aparece un acceso nuevo."]], ["Un cambio discreto de permisos nunca debe pasar inadvertido.", ["Pon el monitor a 15 minutos y acepta el estado actual como referencia.", "Recibe una notificación en cuanto una app obtiene acceso a notificaciones, accesibilidad o medios.", "Activa la seguridad de pantalla de Signal y la pantalla protegida de la app."]], ["Protege a quienes nunca pidieron un agente.", ["Revisad juntos el teléfono de un familiar, app por app.", "Envía el mensaje ya preparado pidiendo a tus contactos que no reenvíen chats a un agente.", "Activa el recordatorio semanal para que la revisión se vuelva hábito."]]], "name": "Español"}, "pt": {"tag": "Um escudo contra os agentes de IA que leem o seu telemóvel", "lede": "A STRAJA mostra que apps podem ler as suas notificações, o ecrã, as fotografias e os SMS, avisa-o quando uma nova obtém acesso e leva-o ao ecrã exato das definições para o revogar. Offline, sem contas, sem permissão de Internet.", "dl_a": "Transferir APK (Android)", "dl_i": "Transferir IPA (iPhone, não assinado)", "dl_s": "Código no GitHub", "stats": [["0", "permissões de Internet"], ["4", "vias de acesso auditadas"], ["8", "idiomas"], ["12", "itens da lista"]], "why_h": "Porque existe a STRAJA", "why": "Em novembro de 2026, um artigo de imprensa alertava que os agentes de IA com as permissões certas podem ler o que aparece no telemóvel: mensagens de apps encriptadas, fotografias, notificações. A encriptação não foi quebrada; o conteúdo é lido quando é mostrado. A STRAJA transforma o alerta em algo que pode verificar e corrigir.", "routes_h": "As quatro vias pelas quais um agente chega às suas mensagens", "routes": [["Notificações", "Um ouvinte de notificações vê cada mensagem no instante em que é mostrada, seja qual for a app."], ["Acessibilidade", "Um serviço de acessibilidade pode ler todo o ecrã e tocar por si."], ["Assistente digital", "O assistente predefinido pode receber o texto do ecrã ou uma captura."], ["Fotos e SMS", "As permissões de multimédia, armazenamento e SMS expõem a galeria e as mensagens."]], "demo_h": "Experimente a auditoria", "demo_intro": "Um telemóvel de exemplo. Ligue e desligue acessos e veja o risco mudar, com o mesmo cálculo da app.", "d_ch": ["Notificações", "Acessibilidade", "Fotos/SMS"], "d_risk": "Risco do telemóvel", "d_lv": ["Risco baixo", "Risco médio", "Risco alto"], "aud_h": "Para quem é", "aud": [["Todos", "Veja num só ecrã quem pode ler o seu telemóvel e corrija os piores casos com poucos toques."], ["Jornalistas e ativistas", "Receba um alerta assim que uma app ganha novo acesso, para que uma alteração discreta de permissões não passe despercebida."], ["Famílias", "Revejam juntos o telemóvel de um familiar e enviem uma mensagem já pronta a pedir aos contactos que não entreguem as suas conversas a um agente."]], "shots_h": "Ecrãs", "feat_h": "Funcionalidades", "feats": [["Auditoria de acessos (Android)", "Lista as apps com acesso a notificações, serviços de acessibilidade, função de assistente e permissões de multimédia/SMS, com uma pontuação de risco por app e para todo o telemóvel."], ["Monitor em segundo plano", "Uma verificação periódica compara o telemóvel com uma referência e avisa-o de cada novo acesso. Nada sai do telemóvel."], ["Um toque até ao ecrã certo", "Abre a página exata das definições do sistema para revogar um acesso; nunca altera nada em silêncio."], ["Acesso temporário", "Dê acesso para uma tarefa e receba um lembrete para o retirar passados 15 minutos, 1 hora, 4 horas ou um dia."], ["Guia de proteção", "Uma lista de 12 itens do artigo, lembrete semanal, proteção de ecrã do Signal e uma mensagem para os seus contactos."], ["Privada por conceção", "Sem permissão INTERNET, sem cópia de segurança, capturas da própria app bloqueadas, 8 idiomas, temas claro e escuro."]], "lim_h": "Limites honestos", "lims": ["A STRAJA não consegue parar um agente. O Android e o iOS não permitem que uma app revogue o acesso de outra; mostra, avisa e leva-o ao ecrã certo.", "Não consegue bloquear as capturas feitas por outras apps. Só o seu próprio ecrã está protegido.", "iPhone: o iOS esconde as permissões das outras apps, por isso não há auditoria, apenas o guia, um registo manual e lembretes.", "A lista de agentes de IA conhecidos é indicativa. Marque à mão o que faltar."], "start_h": "Início rápido", "steps": ["Transfira o APK (Android) ou o IPA não assinado (iPhone, a instalar com AltStore ou Sideloadly) da última versão.", "Abra a STRAJA e toque em Analisar agora (Android) ou abra o Guia (iPhone).", "Abra a lista de apps, toque numa app e siga o botão para revogar o que não precisa.", "Ative o monitor e o lembrete semanal."], "ios_note": "O ficheiro para iPhone não está assinado com um certificado de programador da Apple; as ferramentas de instalação assinam-no com o seu próprio Apple ID.", "priv_h": "Privacidade", "priv": "Sem análise, sem servidores, sem contas e sem permissão INTERNET: a app não consegue enviar nada para fora. Tudo o que mostra fica no telemóvel e a cópia de segurança do Android está desativada.", "build": "Requer Node 24 ou superior e JDK 21. Execute npm install, npm test e depois npx cap sync. O fluxo do GitHub Actions compila o APK assinado e o IPA não assinado e anexa-os a cada etiqueta v*.", "docs_h": "Documentação", "doc_l": ["Registo de alterações", "Código-fonte", "Versões"], "sup_h": "Apoie o projeto", "sup": "A STRAJA é gratuita e trade-free. Se lhe for útil, pode oferecer um café ao autor:", "foot": "MIT © Alexandru-Ionuț Chiuță (Alexio)", "sec": {"feat": "Funcionalidades", "routes": "As quatro vias de acesso", "start": "Início rápido", "lim": "Limites honestos", "build": "Compilação", "priv": "Privacidade", "sup": "Apoie o projeto", "lic": "Licença", "docs": "Documentação"}, "ver": "Versão: {v} · Última atualização: {d}", "how": "Como ajuda", "allrel": "Todas as versões", "fsm": "Texto mais pequeno", "fsp": "Texto maior", "pp": "O Android pode mostrar um aviso de app desconhecida ou do Play Protect para um APK instalado manualmente. É normal: a app é de código aberto e não tem permissão de Internet.", "nav": ["Para quem", "Experimente", "Ecrãs", "Funcionalidades", "Início", "Docs"], "audx": [["Saiba quem lê o seu telemóvel.", ["Analise: veja todas as apps com acesso a notificações, ecrã, fotos e SMS.", "Revogue: toque na app e vá direto ao ecrã certo das definições.", "Vigie: o monitor avisa-o quando surge um novo acesso."]], ["Uma alteração discreta de permissões nunca deve passar despercebida.", ["Defina o monitor para 15 minutos e aceite o estado atual como referência.", "Receba uma notificação assim que uma app ganha acesso a notificações, acessibilidade ou multimédia.", "Ative a proteção de ecrã do Signal e o ecrã protegido da app."]], ["Proteja quem nunca pediu um agente.", ["Revejam juntos o telemóvel de um familiar, app a app.", "Envie a mensagem já pronta a pedir aos contactos que não reencaminhem conversas a um agente.", "Ative o lembrete semanal para que a revisão se torne hábito."]]], "name": "Português"}, "de": {"tag": "Ein Schutzschild gegen KI-Agenten, die Ihr Handy mitlesen", "lede": "STRAJA zeigt, welche Apps Ihre Benachrichtigungen, Ihren Bildschirm, Ihre Fotos und SMS lesen können, warnt Sie, wenn eine neue Zugriff erhält, und führt Sie zur genauen Einstellungsseite, um ihn zu entziehen. Offline, ohne Konten, ohne Internet-Berechtigung.", "dl_a": "APK herunterladen (Android)", "dl_i": "IPA herunterladen (iPhone, unsigniert)", "dl_s": "Quellcode auf GitHub", "stats": [["0", "Internet-Berechtigungen"], ["4", "geprüfte Zugriffswege"], ["8", "Sprachen"], ["12", "Checklistenpunkte"]], "why_h": "Warum es STRAJA gibt", "why": "Im November 2026 warnte ein Presseartikel, dass KI-Agenten mit den passenden Berechtigungen mitlesen können, was auf dem Handy erscheint: Nachrichten verschlüsselter Apps, Fotos, Benachrichtigungen. Die Verschlüsselung ist nicht geknackt; der Inhalt wird gelesen, wenn er angezeigt wird. STRAJA macht aus der Warnung etwas, das Sie prüfen und beheben können.", "routes_h": "Die vier Wege, auf denen ein Agent an Ihre Nachrichten kommt", "routes": [["Benachrichtigungen", "Ein Benachrichtigungs-Listener sieht jede Nachricht im Moment der Anzeige, egal von welcher App."], ["Bedienungshilfen", "Ein Bedienungshilfen-Dienst kann den ganzen Bildschirm lesen und für Sie tippen."], ["Digitaler Assistent", "Der Standard-Assistent kann den Bildschirmtext oder einen Screenshot erhalten."], ["Fotos und SMS", "Berechtigungen für Medien, Speicher und SMS legen Galerie und Textnachrichten offen."]], "demo_h": "Prüfung ausprobieren", "demo_intro": "Ein Beispiel-Handy. Schalten Sie Zugriffe ein und aus und sehen Sie das Risiko steigen oder sinken, mit derselben Berechnung wie in der App.", "d_ch": ["Benachrichtigungen", "Bedienungshilfen", "Fotos/SMS"], "d_risk": "Handy-Risiko", "d_lv": ["Geringes Risiko", "Mittleres Risiko", "Hohes Risiko"], "aud_h": "Für wen", "aud": [["Alle", "Sehen Sie auf einem Bildschirm, wer Ihr Handy lesen kann, und beheben Sie die schlimmsten Fälle mit wenigen Tipps."], ["Journalisten und Aktivisten", "Werden Sie sofort gewarnt, wenn eine App neuen Zugriff erhält, damit eine stille Änderung von Berechtigungen nicht unbemerkt bleibt."], ["Familien", "Prüfen Sie gemeinsam das Handy eines Angehörigen und senden Sie eine fertige Nachricht, die Kontakte bittet, Ihre Chats nicht an einen Agenten zu geben."]], "shots_h": "Bildschirme", "feat_h": "Funktionen", "feats": [["Zugriffsprüfung (Android)", "Listet Apps mit Zugriff auf Benachrichtigungen, Bedienungshilfen-Diensten, Assistentenrolle und Medien-/SMS-Berechtigungen, mit Risikowert pro App und für das ganze Handy."], ["Hintergrundmonitor", "Eine regelmäßige Prüfung vergleicht das Handy mit einer Referenz und meldet jeden neuen Zugriff. Nichts verlässt das Handy."], ["Ein Tipp zur richtigen Seite", "Öffnet genau die Systemeinstellung, in der Sie einen Zugriff entziehen; ändert nie etwas heimlich."], ["Befristeter Zugriff", "Geben Sie Zugriff für eine Aufgabe und erhalten Sie nach 15 Minuten, 1 Stunde, 4 Stunden oder einem Tag eine Erinnerung zum Entziehen."], ["Schutz-Leitfaden", "Eine Checkliste mit 12 Punkten aus dem Artikel, wöchentliche Erinnerung, Signal-Bildschirmschutz und eine Nachricht für Ihre Kontakte."], ["Privat von Grund auf", "Keine INTERNET-Berechtigung, kein Backup, Screenshots der App selbst blockiert, 8 Sprachen, helles und dunkles Design."]], "lim_h": "Ehrliche Grenzen", "lims": ["STRAJA kann einen Agenten nicht stoppen. Android und iOS erlauben einer App nicht, den Zugriff einer anderen zu entziehen; sie zeigt, warnt und führt Sie zur richtigen Seite.", "Sie kann Screenshots anderer Apps nicht blockieren. Nur der eigene Bildschirm ist geschützt.", "iPhone: iOS verbirgt die Berechtigungen anderer Apps, daher gibt es keine Prüfung, nur den Leitfaden, ein manuelles Register und Erinnerungen.", "Die Liste bekannter KI-Agenten ist nur ein Anhaltspunkt. Markieren Sie Fehlendes von Hand."], "start_h": "Schnellstart", "steps": ["Laden Sie die APK (Android) oder die unsignierte IPA (iPhone, Installation mit AltStore oder Sideloadly) aus dem neuesten Release herunter.", "Öffnen Sie STRAJA und tippen Sie auf Jetzt prüfen (Android) oder öffnen Sie den Leitfaden (iPhone).", "Öffnen Sie die App-Liste, tippen Sie eine App an und folgen Sie der Schaltfläche, um Unnötiges zu entziehen.", "Schalten Sie Monitor und wöchentliche Erinnerung ein."], "ios_note": "Die iPhone-Datei ist nicht mit einem Apple-Entwicklerzertifikat signiert; Sideloading-Werkzeuge signieren sie mit Ihrer eigenen Apple-ID.", "priv_h": "Datenschutz", "priv": "Keine Analyse, keine Server, keine Konten und keine INTERNET-Berechtigung: Die App kann nichts nach außen senden. Alles, was sie anzeigt, bleibt auf dem Handy, und das Android-Backup ist deaktiviert.", "build": "Benötigt Node 24 oder neuer und JDK 21. Führen Sie npm install, npm test und dann npx cap sync aus. Der GitHub-Actions-Workflow baut die signierte APK und die unsignierte IPA und hängt sie an jedes v*-Tag.", "docs_h": "Dokumentation", "doc_l": ["Änderungsprotokoll", "Quellcode", "Releases"], "sup_h": "Projekt unterstützen", "sup": "STRAJA ist kostenlos und trade-free. Wenn sie Ihnen hilft, können Sie dem Autor einen Kaffee spendieren:", "foot": "MIT © Alexandru-Ionuț Chiuță (Alexio)", "sec": {"feat": "Funktionen", "routes": "Die vier Zugriffswege", "start": "Schnellstart", "lim": "Ehrliche Grenzen", "build": "Build", "priv": "Datenschutz", "sup": "Projekt unterstützen", "lic": "Lizenz", "docs": "Dokumentation"}, "ver": "Version: {v} · Letzte Aktualisierung: {d}", "how": "So hilft es", "allrel": "Alle Releases", "fsm": "Kleinerer Text", "fsp": "Größerer Text", "pp": "Android kann bei einer manuell installierten APK eine Warnung vor unbekannten Apps oder von Play Protect zeigen. Das ist normal: Die App ist Open Source und hat keine Internet-Berechtigung.", "nav": ["Für wen", "Ausprobieren", "Bildschirme", "Funktionen", "Start", "Docs"], "audx": [["Wissen, wer Ihr Handy liest.", ["Prüfen: Sehen Sie alle Apps mit Zugriff auf Benachrichtigungen, Bildschirm, Fotos und SMS.", "Entziehen: App antippen und direkt zur richtigen Einstellungsseite springen.", "Wachen: Der Monitor meldet, wenn ein neuer Zugriff auftaucht."]], ["Eine stille Änderung von Berechtigungen darf nie unbemerkt bleiben.", ["Stellen Sie den Monitor auf 15 Minuten und übernehmen Sie den aktuellen Zustand als Referenz.", "Erhalten Sie eine Meldung, sobald eine App Zugriff auf Benachrichtigungen, Bedienungshilfen oder Medien bekommt.", "Aktivieren Sie den Bildschirmschutz von Signal und den geschützten Bildschirm der App."]], ["Schützen Sie Menschen, die nie einen Agenten wollten.", ["Gehen Sie das Handy eines Angehörigen gemeinsam durch, App für App.", "Senden Sie die fertige Nachricht, die Kontakte bittet, Chats nicht an einen Agenten weiterzugeben.", "Aktivieren Sie die wöchentliche Erinnerung, damit die Kontrolle zur Gewohnheit wird."]]], "name": "Deutsch"}, "hu": {"tag": "Pajzs a telefonját olvasó mesterségesintelligencia-ügynökök ellen", "lede": "A STRAJA megmutatja, mely appok olvashatják az értesítéseit, a képernyőjét, a fotóit és az SMS-eit, figyelmeztet, ha egy újabb hozzáférést kap, és elvisz a beállítások pontos képer t egy app értesítési, kisegítő vagy médiahozzáférést szerez.", "Kapcsolja be a Signal képernyővédelmét és az app védett képernyőjét."]], ["Védje azokat, akik sosem kértek ügynököt.", ["Nézzék át együtt egy hozzátartozó telefonját, app által app.", "Küldje el a kész üzenetet, amelyben megkéri az ismerősöket, hogy ne továbbítsák a beszélgetéseket ügynöknek.", "Állítsa be a heti emlékeztetőt, hogy az áttekintés szokássá váljon."]]], "name": "Magyar"}};
var LANGS=Object.keys(DATA),REPO="https://github.com/chiuta/STRAJA",VER="1.0.0",DT="2026-11-26",cur='en',aud=0,fs=1;
var APPS=[{n:'Meta AI',ai:1,v:[1,0,1]},{n:'Gemini',ai:1,v:[0,1,1]},{n:'Notes+',ai:0,v:[0,0,0]},{n:'Weather',ai:0,v:[1,0,0]}];
var W=[3,3,2],ICONS=['🛡️','📰','👪'],CHIPS=[[0,1,2,3],[0,1,3],[0,3]],SECS=['who','demo_h','shots_h','feat_h','start_h','docs_h'];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pick(){
  try{var q=new URLSearchParams(location.search).get('lang');if(q&&DATA[q])return q}catch(e){}
  try{var s=localStorage.getItem('straja.site');if(s&&DATA[s])return s}catch(e){}
  var n=String(navigator.language||'en').slice(0,2).toLowerCase();return DATA[n]?n:'en';
}
function setFs(v){fs=Math.min(1.6,Math.max(.8,v));document.documentElement.style.setProperty('--fs',fs);try{localStorage.setItem('straja.fs',fs)}catch(e){}}
function risk(){
  var raw=0;APPS.forEach(function(a){var s=0;a.v.forEach(function(on,i){if(on)s+=W[i]});if(a.ai)s*=1.5;raw+=Math.min(10,s)});
  return Math.round(100*(1-Math.exp(-raw/30)));
}
function renderDemo(){

  $('feats').innerHTML=t.feats.map(function(r){return'<div class="card"><h3>'+esc(r[0])+'</h3><p>'+esc(r[1])+'</p></div>'}).join('');
  $('lims').innerHTML=t.lims.map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
  $('steps').innerHTML=t.steps.map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
  $('shots').innerHTML=['home','apps','monitor','guide'].map(function(n){return'<img loading="lazy" src="media/'+cur+'-'+n+'.webp" alt="STRAJA — '+n+'">'}).join('');
  $('docs').innerHTML=[[t.doc_l[0],REPO+'/blob/main/CHANGELOG.md'],[t.doc_l[1],REPO],[t.doc_l[2],REPO+'/releases']].map(function(d){return'<li><a href="'+d[1]+'">'+esc(d[0])+'</a></li>'}).join('');
  renderDemo();renderAud();
